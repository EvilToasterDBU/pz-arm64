name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  x86-wrapper:
    # the x86-64 half: fake JNIEnv tables + the C++ runtime the game's libraries run against inside Box64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y g++ openjdk-17-jdk-headless
      - run: JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64 scripts/build-x86-wrapper.sh build/x86
      - uses: actions/upload-artifact@v4
        with: { name: x86, path: build/x86 }

  aarch64:
    needs: x86-wrapper
    runs-on: ubuntu-22.04-arm      # old glibc (2.35) so the binaries run on most arm64 distributions
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: sudo apt-get update && sudo apt-get install -y build-essential cmake patch curl python3 openjdk-17-jdk-headless zlib1g-dev
      - uses: actions/download-artifact@v4
        with: { name: x86, path: x86 }
      - name: build
        run: |
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-arm64
          VERSION="${GITHUB_REF_NAME}" X86_DIR="$PWD/x86" scripts/build.sh
          cd dist
          cp pz-arm64-*-linux-aarch64.tar.gz pz-arm64-linux-aarch64.tar.gz
          sha256sum pz-arm64-linux-aarch64.tar.gz > pz-arm64-linux-aarch64.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with: { name: release, path: "dist/pz-arm64-linux-aarch64.tar.gz*" }
      - name: publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/pz-arm64-linux-aarch64.tar.gz
            dist/pz-arm64-linux-aarch64.tar.gz.sha256
            install.sh
